# ─────────────────────────────────────────────────────────────────────────────
# TuringCanvas — CI/CD Pipeline
#
# Triggers: every push to `main`.
# Jobs:
#   1. test-and-build — installs deps, runs tests (gate), then builds.
#   2. deploy         — uploads the dist/ artifact and deploys to GitHub Pages.
#
# Required GitHub repository settings:
#   Settings → Pages → Source: "GitHub Actions"
# ─────────────────────────────────────────────────────────────────────────────

name: CI / Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Allow manual re-runs from the Actions UI without a new commit.
  workflow_dispatch:

# Grant the GITHUB_TOKEN the minimum permissions needed for Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Only allow one Pages deployment to run at a time; cancel in-progress runs
# so that the latest push always wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ── Job 1: Test & Build ────────────────────────────────────────────────────
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest test suite
        # Deployment is gated on a green test suite.
        # Any test failure aborts the workflow here — the build step never runs.
        run: npm test

      - name: Build production bundle
        # GITHUB_ACTIONS=true is automatically set by the runner; vite.config.ts
        # reads it to set base: '/TuringCanvas/' for the GitHub Pages sub-path.
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload the Vite output directory (default: dist/).
          path: ./dist

  # ── Job 2: Deploy ──────────────────────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: test-and-build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
